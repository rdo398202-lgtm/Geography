<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ការប្រឡង តេស្តសមត្ថភាព ខ្លួនឯង - ភូមិវិទ្យា</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap">
<style>
:root{--ocean:#0a4d68;--sea:#088395;--mint:#05bfdb;--land:#2e8b57;--sand:#f2c94c;--bg:#eaf6f6;--card:#fff;--tx:#12303b;--ok:#1b8a4b;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font-family:'Kantumruy Pro','Noto Sans Khmer','Khmer OS',sans-serif;line-height:1.8;
background:
repeating-radial-gradient(circle at 15% 10%,transparent 0 26px,rgba(8,131,149,.07) 26px 28px),
repeating-radial-gradient(circle at 85% 90%,transparent 0 30px,rgba(46,139,87,.08) 30px 32px),
var(--bg);background-attachment:fixed}
header{background:linear-gradient(135deg,var(--ocean),var(--sea) 60%,var(--land));color:#fff;text-align:center;padding:22px 12px 20px;border-bottom:5px solid var(--sand);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.06) 38px 39px),repeating-linear-gradient(0deg,transparent 0 38px,rgba(255,255,255,.06) 38px 39px);pointer-events:none}
.globe{font-size:2.6rem;display:inline-block;animation:spin 8s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.globe{animation:none}}
header h1{margin:2px 0 0;font-size:1.35rem;color:var(--sand);position:relative;z-index:1}
header p{margin:4px 0 0;font-size:.92rem;position:relative;z-index:1}
.logo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--sand);background:#fff;position:relative;z-index:1}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(10,77,104,.14);border-top:4px solid var(--mint)}
h2,h3{color:var(--ocean);margin:.2em 0}
label{display:block;font-weight:600;margin-top:10px}
input,select{width:100%;padding:11px;border:1px solid #9cc7cf;border-radius:10px;font:inherit;background:#fff;color:var(--tx)}
input[readonly]{background:#e6f4ee;font-weight:600;color:var(--land)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--ocean);color:#fff}
button.gold{background:var(--sand);color:#0a3a4d;font-weight:700}
button:disabled{opacity:.4}
a.fb{display:inline-block;margin-top:8px;color:var(--sand);font-size:.85rem;position:relative;z-index:1}
.err{background:#fdecea;color:var(--bad);padding:10px;border-radius:8px;margin-top:10px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.timer{background:var(--ocean);color:var(--sand);padding:6px 14px;border-radius:20px;font-weight:700;font-size:1.1rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:#eef8f8;color:var(--tx);border:2px solid #bfe0e3;padding:12px}
.opt.sel{border-color:var(--land);background:#e3f6ea;font-weight:600}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.pal button{padding:6px 0;background:#d6ecee;color:var(--tx)}
.pal button.done{background:var(--land);color:#fff}
.pal button.cur{outline:3px solid var(--sand)}
.big{font-size:2.4rem;font-weight:700;color:var(--ocean);text-align:center}
.bar{background:#d6ecee;border-radius:6px;height:12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--land),var(--mint))}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.note{font-size:.85rem;color:#4a6a73}
footer{text-align:center;padding:16px;font-size:.95rem;color:var(--ocean);font-weight:600}
</style>
</head>
<body>
<header>
<!-- ដាក់រូបភាព៖ ដាក់តំណរូបភាពផ្ទាល់ (.jpg/.png) ក្នុង LOGO ខាងក្រោម -->
<img id="lg" class="logo" alt="" hidden>
<div class="globe" id="gl">🌏</div>
<h1>ការប្រឡង តេស្តសមត្ថភាព ខ្លួនឯង</h1>
<p>មុខវិជ្ជាភូមិវិទ្យា ថ្នាក់ទី១២ • វិទ្យាល័យប៊ុនរ៉ានីហ៊ុនសែនចាន់ថ្នាល</p>
<a class="fb" href="https://www.facebook.com/share/1DoHKTvuj7/" target="_blank" rel="noopener">📷 មើលរូបភាព/ទំព័រហ្វេសប៊ុក</a>
</header>
<main id="app"></main>
<footer>🧭 អ្នកបង្កើតគេហទំព័រប្រឡង៖ លី ពូអុី</footer>
<script>
const LOGO=""; // ឧទាហរណ៍៖ "logo.jpg"
const SCHOOL="វិទ្យាល័យប៊ុនរ៉ានីហ៊ុនសែនចាន់ថ្នាល";
const CH=["ស្ថានភាពសង្គមកម្ពុជា","ការអភិវឌ្ឍប្រជាជនមិនស្មើគ្នា","សេដ្ឋកិច្ចកម្ពុជា","នគរូបនីយកម្មនៅកម្ពុជា","សហរដ្ឋអាមេរិក","ប្រទេសជប៉ុន","សហភាពអឺរ៉ុប"];
const BANK=[];
const M=(c,q,o,e)=>BANK.push({c,q,o,a:o[0],e,t:"m"});
const T=(c,q,v,e)=>BANK.push({c,q,o:["ពិត","មិនពិត"],a:v?"ពិត":"មិនពិត",e,t:"t"});
M(0,"ដង់ស៊ីតេប្រជាជន គឺជាសមាមាត្ររវាងអ្វី?",["ចំនួនប្រជាជន ធៀបនឹងផ្ទៃក្រឡាដី","ចំនួនកំណើត ធៀបនឹងចំនួនមរណភាព","ចំនួនប្រុស ធៀបនឹងចំនួនស្រី","ចំនួនអ្នកក្រុង ធៀបនឹងអ្នកស្រុក"],"ដង់ស៊ីតេ = ចំនួនប្រជាជន ÷ ផ្ទៃក្រឡា (នាក់/គ.ម²)។");
T(0,"រាជធានីភ្នំពេញមានដង់ស៊ីតេប្រជាជនខ្ពស់ជាងខេត្តភាគច្រើននៅកម្ពុជា។",true,"ភ្នំពេញជាមជ្ឈមណ្ឌលសេដ្ឋកិច្ច និងរដ្ឋបាល ប្រជាជនកកកុញខ្លាំង។");
M(1,"សន្ទស្សន៍អភិវឌ្ឍមនុស្ស (HDI) វាស់ដោយផ្អែកលើកត្តាអ្វីខ្លះ?",["សុខភាព ការអប់រំ និងកម្រិតជីវភាព/ចំណូល","ផ្ទៃដី ព្រំដែន និងអាកាសធាតុ","កងទ័ព ការនាំចេញ និងការនាំចូល","ចំនួនសាលា ផ្លូវ និងស្ពាន"],"HDI រួមមានអាយុកាល ការអប់រំ និងចំណូលក្នុងមួយនាក់។");
M(2,"ដំណាំស្បៀងសំខាន់បំផុតរបស់កម្ពុជាគឺ?",["ស្រូវ","ស្រូវសាលី","កាហ្វេ","តែ"],"ស្រូវជាអាហារចម្បងរបស់ប្រជាជនខ្មែរ។");
T(2,"បឹងទន្លេសាបជាប្រភពត្រីទឹកសាបដ៏សំខាន់របស់កម្ពុជា។",true,"ជាបឹងទឹកសាបធំជាងគេនៅអាស៊ីអាគ្នេយ៍។");
M(3,"នគរូបនីយកម្ម គឺជាអ្វី?",["ដំណើរការកើនឡើងនៃសមាមាត្រប្រជាជនរស់នៅទីក្រុង","ការថយចុះចំនួនប្រជាជន","ការផ្លាស់ទីពីទីក្រុងទៅជនបទ","ការបង្កើនដីស្រែ"],"ទីក្រុងកាន់តែធំ និងប្រជាជនក្រុងកាន់តែច្រើន។");
M(4,"សហរដ្ឋអាមេរិកមានចំនួនរដ្ឋប៉ុន្មាន?",["៥០","៤៨","៥២","៤០"],"មាន ៥០ រដ្ឋ។");
M(5,"រដ្ឋធានីរបស់ប្រទេសជប៉ុនគឺ?",["តូក្យូ","អូសាកា","គីយ៉ូតូ","ណាហ្គោយ៉ា"],"តូក្យូជារដ្ឋធានី។");
M(5,"ភ្នំខ្ពស់បំផុតរបស់ជប៉ុនគឺ?",["ភ្នំហ្វូជី","ភ្នំអាល់ផ៍","ភ្នំអេវើរេស","ភ្នំរ៉ុកគី"],"ភ្នំហ្វូជីខ្ពស់ប្រមាណ ៣៧៧៦ ម៉ែត្រ។");
M(6,"រូបិយប័ណ្ណរួមរបស់ប្រទេសជាច្រើននៅក្នុងសហភាពអឺរ៉ុបគឺ?",["អឺរ៉ូ","ដុល្លារ","ផោន","ហ្វ្រង់"],"តំបន់អឺរ៉ូប្រើរូបិយប័ណ្ណអឺរ៉ូ។");

const $=id=>document.getElementById(id), app=$("app");
if(LOGO){$("lg").src=LOGO;$("lg").hidden=false;$("gl").hidden=true}
const KEY="geo12_self_v1", DUR=900, NQ=10;
const GR=[[85,"A"],[70,"B"],[55,"C"],[40,"D"],[25,"E"],[0,"F"]];
let S=null,tm=null;
const used=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}};
const saveUsed=u=>{try{localStorage.setItem(KEY,JSON.stringify(u))}catch(e){}};
const norm=s=>s.replace(/\s+/g," ").trim().toLowerCase();
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const kh=n=>String(n).replace(/\d/g,d=>"០១២៣៤៥៦៧៨៩"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function reg(msg){
app.innerHTML=`<div class="card"><h2>🧭 ចុះឈ្មោះមុនចូលប្រឡង</h2>
<p class="note">ប្រឡងបានតែម្តងប៉ុណ្ណោះ ក្នុងមួយឈ្មោះ។ ពេលវេលា ${kh(DUR/60)} នាទី ចំនួន ${kh(NQ)} សំណួរ។</p>
<label>ឈ្មោះ និងនាមត្រកូល</label><input id="nm" autocomplete="off" placeholder="ឧទាហរណ៍៖ សុខ ចាន់ណា">
<label>ភេទ</label><select id="sx"><option value="">-- ជ្រើសរើស --</option><option>ប្រុស</option><option>ស្រី</option></select>
<label>ថ្នាក់</label><select id="gd"><option value="">-- ជ្រើសរើស --</option><option>ថ្នាក់ទី៩</option><option>ថ្នាក់ទី១០</option><option>ថ្នាក់ទី១១</option><option>ថ្នាក់ទី១២</option><option>ផ្សេងៗ</option></select>
<label>ឈ្មោះវិទ្យាល័យ</label><input id="sc" value="${SCHOOL}" readonly>
<label>លេខតុប្រឡង (មិនចាំបាច់)</label><input id="tb" autocomplete="off">
<div id="er">${msg?`<div class="err">${msg}</div>`:""}</div>
<div class="row"><button class="gold" id="go">ចាប់ផ្តើមប្រឡង</button></div></div>`;
$("go").onclick=start;}

function start(){
const nm=$("nm").value.trim(),sx=$("sx").value,gd=$("gd").value,sc=SCHOOL,tb=$("tb").value.trim();
const e=m=>{$("er").innerHTML=`<div class="err">${m}</div>`};
if(nm.length<4||!/\s/.test(nm))return e("សូមបញ្ចូលឈ្មោះ និងនាមត្រកូលពេញលេញ (មានចន្លោះរវាងឈ្មោះ និងនាមត្រកូល)។");
if(!sx)return e("សូមជ្រើសរើសភេទ។");
if(!gd)return e("សូមជ្រើសរើសថ្នាក់។");
if(gd!=="ថ្នាក់ទី១២")return e("សូមអភ័យទោស! ការប្រឡងនេះសម្រាប់តែសិស្សថ្នាក់ទី១២ ប៉ុណ្ណោះ។");
const k=norm(nm)+"|"+norm(sc),u=used();
if(u[k]){return reg("ឈ្មោះនេះបានចូលប្រឡងរួចហើយ។ ការប្រឡងអនុញ្ញាតឱ្យប្រឡងបានតែម្តងប៉ុណ្ណោះ។"+(u[k].score!=null?` ពិន្ទុរបស់អ្នក៖ ${kh(u[k].score)}/១០០ (${u[k].g})`:""));}
u[k]={started:Date.now()};saveUsed(u);
const qs=shuf(BANK).slice(0,NQ).map(q=>({...q,o:q.t==="t"?q.o:shuf(q.o)}));
S={k,nm,sx,gd,sc,tb,qs,ans:new Array(qs.length).fill(null),i:0,end:Date.now()+DUR*1000,done:false};
clearInterval(tm);tm=setInterval(tick,500);draw();}

function tick(){if(!S||S.done)return;const r=Math.max(0,Math.ceil((S.end-Date.now())/1000));
const t=$("tm");if(t){t.textContent=kh(String(Math.floor(r/60)).padStart(2,"0"))+":"+kh(String(r%60).padStart(2,"0"))}
if(r<=0)submit(true);}

function draw(){
const q=S.qs[S.i],L=["ក","ខ","គ","ឃ"];
app.innerHTML=`<div class="card"><div class="top"><div><b>${esc(S.nm)}</b><div class="note">${esc(S.sc)}</div></div><div class="timer" id="tm">--:--</div></div></div>
<div class="card"><div class="note">សំណួរទី ${kh(S.i+1)} / ${kh(S.qs.length)}</div>
<p style="font-size:1.1rem;font-weight:600">${esc(q.q)}</p>
${q.o.map((o,j)=>`<button class="opt ${S.ans[S.i]===o?"sel":""}" data-o="${j}">${L[j]}. ${esc(o)}</button>`).join("")}
<div class="row"><button id="pv" ${S.i===0?"disabled":""}>មុន</button><button id="rv" class="gold">ពិនិត្យ/ដាក់ស្នើ</button><button id="nx" ${S.i===S.qs.length-1?"disabled":""}>បន្ទាប់</button></div></div>
<div class="card"><b>បញ្ជីសំណួរ</b><div class="pal">${S.qs.map((_,j)=>`<button data-j="${j}" class="${S.ans[j]!==null?"done":""} ${j===S.i?"cur":""}">${kh(j+1)}</button>`).join("")}</div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[S.i]=q.o[+b.dataset.o];draw()});
app.querySelectorAll(".pal button").forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;draw()});
$("pv").onclick=()=>{S.i--;draw()};$("nx").onclick=()=>{S.i++;draw()};$("rv").onclick=review;tick();}

function review(){
const un=S.ans.map((a,i)=>a===null?i+1:null).filter(Boolean);
app.innerHTML=`<div class="card"><h2>ពិនិត្យចម្លើយមុនដាក់ស្នើ</h2>
<p>បានឆ្លើយ ${kh(S.ans.length-un.length)} / ${kh(S.ans.length)} សំណួរ។</p>
${un.length?`<p class="bad">មិនទាន់ឆ្លើយសំណួរទី៖ ${un.map(kh).join(", ")}</p>`:`<p class="ok">បានឆ្លើយគ្រប់សំណួរ។</p>`}
<p class="note">ពេលវេលានៅសល់៖ <b id="tm"></b></p>
<div class="pal">${S.qs.map((_,j)=>`<button data-j="${j}" class="${S.ans[j]!==null?"done":""}">${kh(j+1)}</button>`).join("")}</div>
<div class="row"><button id="bk">ត្រឡប់ទៅឆ្លើយបន្ត</button><button id="sb" class="gold">ដាក់ស្នើចម្លើយ</button></div></div>`;
app.querySelectorAll(".pal button").forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;draw()});
$("bk").onclick=draw;$("sb").onclick=()=>{if(confirm("តើអ្នកប្រាកដថាចង់ដាក់ស្នើមែនទេ? មិនអាចកែបានទៀតទេ។"))submit(false)};tick();}

function submit(auto){
if(!S||S.done)return;S.done=true;clearInterval(tm);
const N=S.qs.length;let c=0;const per=CH.map(()=>({t:0,c:0}));
S.qs.forEach((q,i)=>{per[q.c].t++;if(S.ans[i]===q.a){c++;per[q.c].c++}});
const score=Math.round(c/N*1000)/10,g=GR.find(x=>score>=x[0])[1];
const u=used();u[S.k]={score,g,done:Date.now()};saveUsed(u);
result(c,N,score,g,per,auto);}

function result(c,N,score,g,per,auto){
const weak=per.map((p,i)=>({i,p})).filter(x=>x.p.t&&x.p.c/x.p.t<0.6);
app.innerHTML=`<div class="card"><h2>🏁 លទ្ធផលប្រឡង</h2>${auto?`<p class="bad">អស់ពេល! ប្រព័ន្ធបានដាក់ស្នើដោយស្វ័យប្រវត្តិ។</p>`:""}
<p>ឈ្មោះ៖ <b>${esc(S.nm)}</b> | ភេទ៖ ${esc(S.sx)} | ${esc(S.gd)}<br>វិទ្យាល័យ៖ ${esc(S.sc)}${S.tb?` | លេខតុ៖ ${esc(S.tb)}`:""}</p>
<div class="big">${kh(score)} / ១០០</div><p style="text-align:center">ភាគរយ ${kh(score)}% | និទ្ទេស <b>${g}</b></p>
<p>ចម្លើយត្រូវ៖ <span class="ok">${kh(c)}</span> | ចម្លើយខុស/មិនឆ្លើយ៖ <span class="bad">${kh(N-c)}</span><br>ស្ថានភាព៖ <b>${score>=55?"ជាប់ (តាមមាត្រដ្ឋានហាត់ប្រាណ)":"ធ្លាក់ (តាមមាត្រដ្ឋានហាត់ប្រាណ)"}</b></p>
<p class="note">មាត្រដ្ឋាននិទ្ទេសនេះសម្រាប់តេស្តសមត្ថភាពខ្លួនឯង (A:៨៥–១០០, B:៧០–៨៤, C:៥៥–៦៩, D:៤០–៥៤, E:២៥–៣៩, F:០–២៤) មិនមែនជាបទប្បញ្ញត្តិផ្លូវការរបស់ក្រសួងអប់រំ យុវជន និងកីឡាទេ។</p></div>
<div class="card"><h3>លទ្ធផលតាមជំពូក</h3>${per.map((p,i)=>p.t?`<div>${esc(CH[i])} — ${kh(p.c)}/${kh(p.t)}<div class="bar"><i style="width:${p.c/p.t*100}%"></i></div></div>`:"").join("")}
<h3>ដំបូន្មានសម្រាប់ការសិក្សាបន្ត</h3>${weak.length?`<p>សូមរៀនឡើងវិញនូវជំពូក៖ ${weak.map(x=>"«"+CH[x.i]+"»").join(" , ")} ដោយអានសៀវភៅសិក្សាភូមិវិទ្យាថ្នាក់ទី១២។</p>`:`<p>លទ្ធផលល្អ! សូមបន្តអានសៀវភៅសិក្សា និងហាត់ធ្វើលំហាត់បន្ថែម។</p>`}</div>
<div class="card"><h3>ចម្លើយត្រឹមត្រូវ និងការពន្យល់</h3>${S.qs.map((q,i)=>{const ok=S.ans[i]===q.a;return `<div style="border-top:1px solid #d6ecee;padding:8px 0"><b>${kh(i+1)}. ${esc(q.q)}</b><br>ចម្លើយអ្នក៖ <span class="${ok?"ok":"bad"}">${S.ans[i]===null?"មិនបានឆ្លើយ":esc(S.ans[i])}</span><br>ចម្លើយត្រូវ៖ <span class="ok">${esc(q.a)}</span><br><span class="note">${esc(q.e)} (ជំពូក៖ ${esc(CH[q.c])})</span></div>`}).join("")}</div>`;
window.scrollTo(0,0);}

window.addEventListener("beforeunload",e=>{if(S&&!S.done){e.preventDefault();e.returnValue=""}});
reg();
</script>
</body>
</html>
